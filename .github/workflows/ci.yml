name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Java 17 (Android derlemesi)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: MAUI workload
        run: dotnet workload restore FinTrack.slnx

      - name: Restore
        run: dotnet restore FinTrack.slnx

      - name: Build
        run: dotnet build FinTrack.slnx --nologo --no-restore --configuration Release

      - name: Test
        run: >-
          dotnet test FinTrack.slnx --nologo --no-build --configuration Release
          --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
